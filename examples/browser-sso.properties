# Cloudera JDBC Connector for Apache Impala 2.6.38 browser SSO example.
# The browser handles the IdP interaction; do not add credentials to this file or URL.
connection.auth.mode = BROWSER_SSO
connection.url = jdbc:impala://impala.example.com:28000/default;AuthMech=12;SSL=1;TransportMode=http;httpPath=cliservice;SSOWebServerTimeout=60
jdbc.driver.class.name = com.cloudera.impala.jdbc41.Driver
connection.query = SELECT CURRENT_USER()
