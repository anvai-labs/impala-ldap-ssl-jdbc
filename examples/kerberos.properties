# Kerberos ticket-cache example. Acquire a TGT separately; do not add a keytab to this repository.
connection.auth.mode = KERBEROS
connection.url = jdbc:impala://impala.example.com:21050/default;AuthMech=1;SSL=1;KrbRealm=EXAMPLE.COM;KrbHostFQDN=impala.example.com;KrbServiceName=impala
jdbc.driver.class.name = com.cloudera.impala.jdbc41.Driver
connection.query = SELECT CURRENT_USER()
